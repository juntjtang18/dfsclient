<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFS Client Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Additional styling for card and container */
        .x-container {
            max-width: 600px;
            margin-top: 50px;
            padding: 20px;
        }
        .form-container {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            background-color: #f8f9fa;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-block {
            width: 100%;
        }
    </style>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container x-container">
        <div class="form-container">
            <h1 class="text-center mb-4">Upload Directory</h1>
            <form id="uploadForm" action="/upload-directory" method="post">
                <div class="form-group mb-3">
                    <label for="directoryPath" class="form-label">Enter Directory Path</label>
                    <input type="text" class="form-control" id="directoryPath" name="directory" placeholder="Enter full directory path" required>
                    <small class="form-text text-muted">Type or paste the full path of the directory you wish to upload.</small>
                </div>
                <div class="form-group mb-4">
                    <label for="targetDfsDir" class="form-label">Target DFS Directory</label>
                    <input type="text" class="form-control" id="targetDfsDir" name="targetDfsDir" placeholder="Enter target DFS directory (default: /)" value="/" required>
                    <small class="form-text text-muted">Enter the destination directory on the DFS server.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Submit Directory Path</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
